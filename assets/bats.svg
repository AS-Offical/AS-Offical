<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05050d"/>
      <stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .bat { fill: #0a0a12; stroke: #7c3aed; stroke-width: 0.8; }
    .wl { transform-box: fill-box; transform-origin: 100% 50%; animation: flapl 0.35s ease-in-out infinite alternate; }
    .wr { transform-box: fill-box; transform-origin: 0% 50%; animation: flapr 0.35s ease-in-out infinite alternate; }
    @keyframes flapl { from { transform: scaleY(1) skewY(0deg); } to { transform: scaleY(0.3) skewY(-8deg); } }
    @keyframes flapr { from { transform: scaleY(1) skewY(0deg); } to { transform: scaleY(0.3) skewY(8deg); } }
    .b1 { animation: f1 11s linear infinite; animation-delay: -3s; }
    .b2 { animation: f2 8s linear infinite; animation-delay: -5s; }
    .b3 { animation: f3 14s linear infinite; animation-delay: -9s; }
    .b4 { animation: f4 10s linear infinite; animation-delay: -1s; }
    @keyframes f1 {0%{transform:translate(-80px,150px) scale(1.0)}25%{transform:translate(200px,95px) scale(1.0)}50%{transform:translate(420px,165px) scale(1.0)}75%{transform:translate(640px,100px) scale(1.0)}100%{transform:translate(900px,145px) scale(1.0)}}
    @keyframes f2 {0%{transform:translate(-80px,70px) scale(0.7)}30%{transform:translate(260px,120px) scale(0.7)}60%{transform:translate(520px,60px) scale(0.7)}100%{transform:translate(900px,110px) scale(0.7)}}
    @keyframes f3 {0%{transform:translate(-80px,190px) scale(1.4)}20%{transform:translate(150px,150px) scale(1.4)}55%{transform:translate(450px,205px) scale(1.4)}80%{transform:translate(700px,150px) scale(1.4)}100%{transform:translate(900px,180px) scale(1.4)}}
    @keyframes f4 {0%{transform:translate(-80px,110px) scale(0.85)}35%{transform:translate(300px,170px) scale(0.85)}70%{transform:translate(600px,90px) scale(0.85)}100%{transform:translate(900px,130px) scale(0.85)}}
    .star { fill: #e5e7eb; animation: tw 3s ease-in-out infinite; }
    .s2 { animation-delay: 0.7s; } .s3 { animation-delay: 1.4s; } .s4 { animation-delay: 2.1s; }
    @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .title { font-family: "Fira Code", "JetBrains Mono", Consolas, monospace; fill: #a78bfa; font-size: 20px; font-weight: 700; letter-spacing: 4px; }
    .sub { font-family: "Fira Code", "JetBrains Mono", Consolas, monospace; fill: #6b7280; font-size: 13px; }
  </style>
